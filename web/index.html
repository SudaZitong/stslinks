<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TukJiu Search</title>
  <meta name="theme-color" content="#f5c400">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%231c1d21'/%3E%3Ccircle cx='22' cy='12' r='6' fill='%23f5c400'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css?v=beauty">
</head>
<body>
  <header>
    <button type="button" id="btn-home" class="logo">TukJiu<span class="dot" aria-hidden="true"></span></button>
    <form id="search-form">
      <input id="q" type="search" autofocus autocomplete="off" data-i18n-placeholder="searchPh">
      <button type="submit" data-i18n="search">搜索</button>
      <button type="button" id="btn-local" class="ghost" data-i18n="local">仅本地</button>
    </form>
    <div class="toolbar">
      <button type="button" id="btn-lang">EN</button>
      <button type="button" id="btn-add" data-i18n="add">添加</button>
      <button type="button" id="btn-settings" data-i18n="settings">设置</button>
    </div>
  </header>

  <div id="stage">
    <p id="status"></p>
    <details id="trace" hidden>
      <summary>
        <span id="trace-label" data-i18n="traceTitle">思考中</span>
        <span id="trace-phase"></span>
      </summary>
      <pre id="trace-body"></pre>
    </details>
    <p id="whale" class="whale" hidden></p>
    <main id="results"></main>
    <p id="empty" class="hint" hidden data-i18n="empty">说你要干什么。短标签先收窄，再用长描述筛一遍。</p>
  </div>

  <dialog id="edit-dlg">
    <form method="dialog" id="edit-form">
      <h3 data-i18n="editTitle">链接</h3>
      <label><span data-i18n="fTitle">标题</span><input name="title" required></label>
      <label><span>URL</span><input name="url" required></label>
      <label><span data-i18n="fTags">标签</span><input name="tags"></label>
      <label><span data-i18n="fDesc">描述</span><textarea name="desc" rows="3"></textarea></label>
      <menu>
        <button value="cancel" data-i18n="cancel">取消</button>
        <button value="ok" data-i18n="save">保存</button>
      </menu>
    </form>
  </dialog>

  <dialog id="set-dlg">
    <form method="dialog" id="set-form">
      <h3 data-i18n="settings">设置</h3>
      <p class="hint" data-i18n="setHint">可加多层 OpenAI 兼容接口。当前层先用，失败再试下一层。</p>
      <label data-i18n="active">当前层</label>
      <select name="active" id="cfg-active"></select>
      <label>名称<input name="name" placeholder="uuapi"></label>
      <label>Base URL<input name="base_url" placeholder="https://uuapi.io/v1"></label>
      <label>API Key<input name="api_key" type="password" autocomplete="off"></label>
      <label>Model<input name="model" placeholder="gpt-5.6-terra"></label>
      <label class="check"><input type="checkbox" name="thinking"> <span data-i18n="thinking">思考过程</span></label>
      <p id="key-state"></p>
      <menu>
        <button value="cancel" data-i18n="cancel">取消</button>
        <button value="ok" data-i18n="save">保存</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/app.js?v=beauty"></script>
</body>
</html>
